[package]
name = "modbusio"
version = "0.1.0"
description = "Modbus browser"
repository = "https://github.com/Wobi848/modbusio"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# reading vendor register lists from Excel (profile_import.rs)
calamine = "0.38"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
if-addrs = "0.15.0"
mime_guess = "2"
rust-embed = "8"
rust_xlsxwriter = "0.102.0"
# the check for a new release (update.rs): ring as in bacnetio, so no system TLS on any platform
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio-serial = "5"

[dev-dependencies]
# the test's own clock for the recording, which samples every 5 s at the fastest
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp-server", "rtu-server", "rtu-over-tcp-server"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
