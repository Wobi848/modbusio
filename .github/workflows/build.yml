name: Build

# A branch is checked through its pull request; a push to it alone would run everything twice.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a pull request pushed again: the run for the older state stops
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows too: sockets, serial ports and paths behave differently there
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: node --test tests/web/*.test.js
        shell: bash

  # Operate the interface in a browser (tests/ui) against the simulators, in all three engines
  ui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --all-targets
      - run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps ${{ matrix.browser }}
        # the download of a browser's system packages has hung before
        timeout-minutes: 15
      - run: node tests/ui/run.mjs
        # a browser that hangs would otherwise hold the job until GitHub's six-hour limit
        timeout-minutes: 20
        env:
          MODBUSIO_TEST_BROWSER: ${{ matrix.browser }}

  build:
    needs: test
    # only for a release (tag v…) or by hand (Actions → Build → Run workflow)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: modbusio-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: modbusio-windows-x86_64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/modbusio${{ matrix.exe }} dist/${{ matrix.name }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  android:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Package
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/modbusio-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: modbusio-android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-24.04
    # the only job that changes the repository: it attaches the builds to the release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
