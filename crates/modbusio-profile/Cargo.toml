[package]
name = "modbusio-profile"
version = "0.1.0"
description = "Profiles of Modbus devices: their points, data types, word order and scaling, without I/O"
repository = "https://github.com/Wobi848/modbusio"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
modbusio-protocol = { path = "../modbusio-protocol" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The tests read and write profiles as the data folder keeps them, in JSON.
serde_json = "1"
